<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>CMSmosis · 개념이 스며든다</title>

<meta name="theme-color" content="#4ecdb0" />
<meta name="description" content="중등 수학·과학 개념을 소리 내어 말하며 외우는 학습 앱" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="CMSmosis" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================================
   디자인 시스템
   ============================================================ */
:root {
  --green:        #4ecdb0;
  --green-dark:   #3aab92;
  --blue:         #5ec5e0;
  --blue-dark:    #46a8c2;
  --yellow:       #f7c948;
  --yellow-dark:  #dcac2c;
  --red:          #ff8f8f;
  --red-dark:     #e97676;
  --purple:       #b8a7e0;

  --ink:          #3a4a46;
  --ink-soft:     #7d8c88;
  --line:         #e3eeea;
  --surface:      #ffffff;
  --bg:           #f4fbf9;

  --radius:       18px;
  --shadow-lift:  0 4px 14px rgba(0,0,0,.07);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }

body {
  font-family: 'Pretendard', -apple-system, 'Malgun Gothic', sans-serif;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  display: flex;
  justify-content: center;
  overflow-x: hidden;
}

.hidden { display: none !important; }

/* ---------- 공통 버튼 (입체 눌림 효과) ---------- */
.btn {
  border: none;
  border-radius: 14px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: .3px;
  padding: 14px 20px;
  cursor: pointer;
  color: #fff;
  transition: transform .06s ease, box-shadow .06s ease, filter .15s ease;
  position: relative;
  top: 0;
}
.btn:active { top: 3px; box-shadow: none !important; }
.btn:disabled { filter: grayscale(.6) opacity(.55); cursor: default; }
.btn:disabled:active { top: 0; }

.btn-green  { background: var(--green);  box-shadow: 0 4px 0 var(--green-dark); }
.btn-blue   { background: var(--blue);   box-shadow: 0 4px 0 var(--blue-dark); }
.btn-yellow { background: var(--yellow); box-shadow: 0 4px 0 var(--yellow-dark); color: #7a5f1e; }
.btn-red    { background: var(--red);    box-shadow: 0 4px 0 var(--red-dark); }
.btn-ghost  {
  background: #fff; color: var(--ink-soft);
  box-shadow: 0 0 0 2px var(--line) inset, 0 4px 0 var(--line);
}
.btn-wide { width: 100%; }

/* ============================================================
   로그인 화면
   ============================================================ */
#authScreen {
  width: 100%;
  max-width: 420px;
  padding: 48px 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.logo-mark {
  width: 78px; height: 78px;
  border-radius: 24px;
  background: linear-gradient(145deg, var(--green), #86dfc9);
  box-shadow: 0 8px 0 var(--green-dark);
  display: grid; place-items: center;
  font-size: 38px;
  margin-bottom: 20px;
}
.logo-type {
  font-size: 30px; font-weight: 900; letter-spacing: -.5px;
  color: var(--green-dark); margin: 0;
}
.logo-tag { font-size: 14px; color: var(--ink-soft); margin: 6px 0 32px; font-weight: 600; }

.auth-card {
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 20px;
  width: 100%;
}
.field { margin-bottom: 12px; }
.field label {
  display: block; font-size: 12px; font-weight: 800;
  color: var(--ink-soft); margin-bottom: 6px; letter-spacing: .4px;
}
.field input {
  width: 100%; padding: 14px 16px;
  border: 2px solid var(--line); border-radius: 14px;
  font-family: inherit; font-size: 15px; font-weight: 600;
  outline: none; background: #fbfefd;
  transition: border-color .15s ease;
}
.field input:focus { border-color: var(--blue); background: #fff; }

.auth-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.auth-msg {
  font-size: 13px; font-weight: 700; text-align: center;
  margin-top: 14px; min-height: 18px;
}
.auth-msg.err  { color: var(--red); }
.auth-msg.ok   { color: var(--green-dark); }

/* ============================================================
   앱 셸
   ============================================================ */
#app {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  padding-bottom: 78px; /* 탭바 높이 */
}

/* ---------- 상단 HUD ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: rgba(244,251,249,.94);
  backdrop-filter: blur(8px);
  padding: 12px 16px 10px;
  border-bottom: 1px solid var(--line);
}
.hud { display: flex; align-items: center; gap: 8px; }
.chip {
  display: flex; align-items: center; gap: 5px;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 13px; font-weight: 900;
}
.chip.streak { color: #ff9f5e; }
.chip.level   { color: var(--blue-dark); }
.chip-spacer { flex: 1; }
.icon-btn {
  border: none; background: transparent; cursor: pointer;
  font-size: 18px; padding: 6px; border-radius: 10px; color: var(--ink-soft);
}
.icon-btn:hover { background: #eef5f3; }

.goal-wrap { margin-top: 10px; }
.goal-row {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 11px; font-weight: 800; color: var(--ink-soft);
  margin-bottom: 5px; letter-spacing: .3px;
}
.goalbar {
  height: 14px; background: var(--line);
  border-radius: 999px; overflow: hidden;
}
.goalbar-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--green), #86dfc9);
  border-radius: 999px;
  transition: width .45s cubic-bezier(.34,1.4,.64,1);
  position: relative;
}
.goalbar-fill::after {
  content: ''; position: absolute; inset: 3px 6px auto 6px; height: 4px;
  background: rgba(255,255,255,.45); border-radius: 999px;
}

/* ---------- 탭 컨텐츠 ---------- */
main { flex: 1; padding: 18px 16px 8px; }
.tab { display: none; animation: fadeUp .28s ease; }
.tab.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- 단원 선택 ---------- */
.unit-scroll {
  display: flex; gap: 8px; overflow-x: auto;
  padding-bottom: 12px; margin-bottom: 4px;
  scrollbar-width: none;
}
.unit-scroll::-webkit-scrollbar { display: none; }
.unit-pill {
  flex: 0 0 auto;
  border: 2px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 9px 16px;
  font-family: inherit; font-size: 13px; font-weight: 800;
  color: var(--ink-soft); cursor: pointer; white-space: nowrap;
  transition: all .15s ease;
}
.unit-pill.on {
  border-color: var(--green); background: #e6f7f2; color: var(--green-dark);
}

/* ---------- 플래시카드 ---------- */
.flashcard {
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lift);
  padding: 24px 22px;
  min-height: 250px;
  display: flex; flex-direction: column;
}
.flashcard.shake { animation: shake .38s; }
.flashcard.pop   { animation: pop .38s; }
@keyframes shake {
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-9px)}
  40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(4px)}
}
@keyframes pop {
  0%{transform:scale(1)} 45%{transform:scale(1.035)} 100%{transform:scale(1)}
}

.fc-meta {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 14px; flex-wrap: wrap;
}
.tag {
  font-size: 10px; font-weight: 900; letter-spacing: .6px;
  padding: 4px 9px; border-radius: 999px; text-transform: uppercase;
}
.tag-unit  { background: #e7f6fb; color: var(--blue-dark); }
.tag-stage { background: #fdf4da; color: #96762b; }
.tag-mode.speak { background: #e3f7f0; color: #2f7a6a; }
.tag-mode.write { background: #f1eefb; color: #7b62c4; }

/* ---------- 자동 채점 결과 ---------- */
.verdict {
  margin-top: 14px; padding: 13px 15px; border-radius: 14px;
  font-size: 14px; font-weight: 800; display: none;
}
.verdict.on { display: block; animation: fadeUp .22s ease; }
.verdict.pass { background: #e3f7f0; color: #2a7565; }
.verdict.near { background: #fdf5e2; color: #96762b; }
.verdict.fail { background: #ffeeee; color: #a33; }
.verdict .kw {
  display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px;
}
.verdict .kw span {
  font-size: 11px; font-weight: 800; padding: 4px 9px; border-radius: 999px;
  background: rgba(255,255,255,.75);
}
.verdict .kw span.hit  { color: #2a7565; }
.verdict .kw span.miss { color: #a33; text-decoration: line-through; opacity: .75; }

.fc-question {
  font-size: 20px; font-weight: 800; line-height: 1.55;
  color: var(--ink); flex: 1;
  word-break: keep-all;
}

/* ---------- 수식(KaTeX) ---------- */
.katex { font-size: 1.03em; }
/* KaTeX 기본 폰트에는 한글이 없어서 \text{} 안의 한글이 깨진다 */
.katex .mord.text, .katex .textrm {
  font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
}
/* 긴 수식이 카드 폭을 밀어내지 않도록 */
.fc-question, .fc-answer { overflow-x: auto; overflow-y: hidden; }

.fc-heard {
  margin-top: 14px; padding: 11px 14px;
  background: #edfaf6; border: 2px dashed #b6e6da;
  border-radius: 12px;
  font-size: 13px; font-weight: 600; color: var(--blue-dark);
  display: none;
}
.fc-heard.on { display: block; }

.fc-answer {
  margin-top: 16px; padding-top: 16px;
  border-top: 2px dashed var(--line);
  font-size: 15px; font-weight: 600; line-height: 1.65; color: #555;
  display: none;
}
.fc-answer.on { display: block; animation: fadeUp .25s ease; }
.fc-answer .lbl {
  display: block; font-size: 11px; font-weight: 900; letter-spacing: .6px;
  color: var(--green-dark); margin-bottom: 6px;
}

.actions { display: flex; gap: 10px; margin-top: 16px; }
.actions .btn { flex: 1; }

/* 마이크 듣는 중 */
.btn-mic.listening { background: var(--red); box-shadow: 0 4px 0 var(--red-dark); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.18)} }

.queue-note {
  text-align: center; font-size: 12px; font-weight: 700;
  color: var(--ink-soft); margin-top: 14px;
}

/* ---------- 학습 탭 하단 미니 랭킹 ---------- */
.minirank {
  margin-top: 14px;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
}
.mr-top {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 15px;
  background: linear-gradient(90deg, #f6fdfb, #fff);
  border-bottom: 2px solid var(--line);
}
.mr-medal {
  width: 34px; height: 34px; flex: 0 0 34px;
  border-radius: 11px; background: #fdf4da;
  display: grid; place-items: center; font-size: 17px;
}
.mr-my { flex: 1; min-width: 0; }
.mr-my .r {
  font-size: 15px; font-weight: 900; color: var(--ink);
}
.mr-my .r em { font-style: normal; color: var(--green-dark); }
.mr-my .chase {
  font-size: 11px; font-weight: 800; color: #ff9f5e; margin-top: 2px;
}
.mr-my .chase.lead { color: var(--green-dark); }
.mr-xp {
  font-size: 17px; font-weight: 900; color: var(--green-dark);
  white-space: nowrap;
}

.mr-list { padding: 5px 8px 8px; }
.mr-row {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 8px; border-radius: 10px;
  font-size: 13px; font-weight: 800;
}
.mr-row.me { background: #e6f7f2; }
.mr-row .n {
  width: 20px; flex: 0 0 20px; text-align: center;
  font-size: 11px; font-weight: 900; color: var(--ink-soft);
}
.mr-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mr-row .sc { color: var(--ink-soft); font-weight: 900; font-size: 12px; }
.mr-more {
  display: block; width: 100%; border: none; background: transparent;
  font-family: inherit; font-size: 11px; font-weight: 900;
  color: var(--blue-dark); padding: 7px 0 3px; cursor: pointer;
}

/* 완료 상태 */
.done-state { text-align: center; padding: 26px 10px; }
.done-state .emoji { font-size: 54px; display: block; margin-bottom: 12px; }
.done-state h3 { margin: 0 0 6px; font-size: 19px; font-weight: 900; }
.done-state p { margin: 0; font-size: 14px; color: var(--ink-soft); font-weight: 600; }

/* ---------- XP 팝업 ---------- */
#xpPop {
  position: fixed; left: 50%; top: 38%;
  transform: translateX(-50%);
  font-size: 26px; font-weight: 900; color: var(--yellow-dark);
  text-shadow: 0 2px 0 #fff, 0 0 14px rgba(255,200,0,.6);
  pointer-events: none; opacity: 0; z-index: 90;
}
#xpPop.go { animation: xpFloat .9s ease-out; }
@keyframes xpFloat {
  0%   { opacity: 0; transform: translate(-50%, 10px) scale(.7); }
  25%  { opacity: 1; transform: translate(-50%, -6px) scale(1.15); }
  100% { opacity: 0; transform: translate(-50%, -54px) scale(1); }
}

/* ---------- 랭킹 ---------- */
.panel {
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 18px;
  margin-bottom: 14px;
}
.panel h2 {
  margin: 0 0 4px; font-size: 16px; font-weight: 900;
}
.panel .desc { font-size: 12px; color: var(--ink-soft); font-weight: 600; margin-bottom: 14px; }

.rank-row {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 10px; border-radius: 14px;
  font-weight: 700;
}
.rank-row + .rank-row { border-top: 1px solid #eef4f2; }
.rank-row.me { background: #e6f7f2; box-shadow: 0 0 0 2px var(--green) inset; }
.rank-badge {
  width: 30px; height: 30px; flex: 0 0 30px;
  border-radius: 10px; display: grid; place-items: center;
  font-size: 13px; font-weight: 900; background: #eef4f2; color: var(--ink-soft);
}
.rank-row:nth-child(1) .rank-badge { background: #fdf4da; color: #a6842f; }
.rank-row:nth-child(2) .rank-badge { background: #eff3f2; color: #93a3a0; }
.rank-row:nth-child(3) .rank-badge { background: #fbeee6; color: #b08257; }
.rank-name { flex: 1; font-size: 15px; font-weight: 800; }
.rank-sub  { font-size: 11px; color: var(--ink-soft); font-weight: 700; }
.rank-score { font-size: 15px; font-weight: 900; color: var(--green-dark); }

/* ---------- 내 기록 / 달력 ---------- */
.stat-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;
}
.stat-box {
  background: var(--surface); border: 2px solid var(--line);
  border-radius: 16px; padding: 14px 16px;
}
.stat-box .k { font-size: 11px; font-weight: 800; color: var(--ink-soft); letter-spacing: .4px; }
.stat-box .v { font-size: 23px; font-weight: 900; margin-top: 3px; }
.stat-box.g .v { color: var(--green-dark); }
.stat-box.b .v { color: var(--blue-dark); }
.stat-box.o .v { color: #ff9f5e; }
.stat-box.p .v { color: #9b86d6; }

.cal-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.cal-title { font-size: 15px; font-weight: 900; }
.cal-nav { display: flex; gap: 6px; }
.cal-nav button {
  border: 2px solid var(--line); background: #fff; border-radius: 10px;
  width: 32px; height: 32px; cursor: pointer; font-size: 14px; font-weight: 900;
  color: var(--ink-soft); font-family: inherit;
}
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal-dow {
  text-align: center; font-size: 10px; font-weight: 900;
  color: var(--ink-soft); padding-bottom: 4px;
}
.cal-dow.sun { color: var(--red); }
.cal-cell {
  aspect-ratio: 1;
  border-radius: 10px;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 800;
  background: #eef5f3; color: #bbb;
  position: relative;
}
.cal-cell.empty { background: transparent; }
.cal-cell.today { box-shadow: 0 0 0 2px var(--blue) inset; }
.cal-cell.l1 { background: #d8f3ec; color: #2f7a6a; }
.cal-cell.l2 { background: #a6e5d6; color: #28675a; }
.cal-cell.l3 { background: #6fd7bf; color: #fff; }
.cal-cell.l4 { background: var(--green); color: #fff; }
.cal-legend {
  display: flex; align-items: center; justify-content: flex-end;
  gap: 5px; margin-top: 12px; font-size: 10px; font-weight: 700; color: var(--ink-soft);
}
.cal-legend i { width: 13px; height: 13px; border-radius: 4px; display: inline-block; }

/* ---------- 하단 탭바 ---------- */
.tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px;
  background: var(--surface);
  border-top: 2px solid var(--line);
  display: grid; grid-template-columns: repeat(3, 1fr);
  z-index: 40;
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar button {
  border: none; background: transparent; cursor: pointer;
  padding: 11px 0 13px; font-family: inherit;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 10px; font-weight: 900; color: #a8bab5;
  transition: color .15s ease;
}
.tabbar button .ico { font-size: 21px; filter: grayscale(1) opacity(.5); transition: filter .15s ease; }
.tabbar button.on { color: var(--green-dark); }
.tabbar button.on .ico { filter: none; }

/* ---------- 컨페티 캔버스 ---------- */
#confettiCanvas {
  position: fixed; inset: 0; pointer-events: none; z-index: 80;
}

/* ---------- 로딩 ---------- */
.skeleton {
  text-align: center; padding: 40px 0;
  font-size: 14px; font-weight: 700; color: var(--ink-soft);
}
</style>
</head>
<body>

<!-- ============================ 로그인 ============================ -->
<div id="authScreen">
  <div class="logo-mark">🌱</div>
  <h1 class="logo-type">CMSmosis</h1>
  <p class="logo-tag">개념이 스며든다 · 중등 수학·과학</p>

  <div class="auth-card">
    <div class="field" id="nameField">
      <label for="nameInput">이름 <span style="color:var(--ink-soft);font-weight:600">(회원가입 시)</span></label>
      <input type="text" id="nameInput" placeholder="홍길동" autocomplete="name" />
    </div>
    <div class="field">
      <label for="emailInput">이메일</label>
      <input type="email" id="emailInput" placeholder="student@example.com" autocomplete="email" />
    </div>
    <div class="field">
      <label for="passwordInput">비밀번호</label>
      <input type="password" id="passwordInput" placeholder="6자 이상" autocomplete="current-password" />
    </div>

    <div class="auth-actions">
      <button class="btn btn-green btn-wide" id="loginBtn">로그인</button>
      <button class="btn btn-ghost btn-wide" id="signupBtn">처음이에요 · 회원가입</button>
    </div>
    <div class="auth-msg" id="authMsg"></div>
  </div>
</div>

<!-- ============================ 앱 ============================ -->
<div id="app" class="hidden">

  <div class="topbar">
    <div class="hud">
      <div class="chip streak">🔥 <span id="streakVal">0</span>일</div>
      <div class="chip level">⚡ Lv.<span id="levelVal">1</span></div>
      <div class="chip-spacer"></div>
      <span style="font-size:12px;font-weight:800;color:var(--ink-soft)" id="userName"></span>
      <button class="icon-btn" id="logoutBtn" title="로그아웃">⏏</button>
    </div>
    <div class="goal-wrap">
      <div class="goal-row">
        <span>오늘의 목표</span>
        <span id="goalText">0 / 20</span>
      </div>
      <div class="goalbar"><div class="goalbar-fill" id="goalFill"></div></div>
    </div>
  </div>

  <main>
    <!-- ---------- 학습 탭 ---------- -->
    <section class="tab active" id="tab-study">
      <div class="unit-scroll" id="unitScroll"></div>

function dateKey(d) {
  // 로컬(한국) 기준 YYYY-MM-DD
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
}

/* 카드 본문에는 hwp 교안에서 복구한 수식이 $...$ 로 들어 있다.
   그 구간만 KaTeX 로 그리고 나머지는 일반 텍스트로 넣는다. */
function renderMath(el, text) {
  el.textContent = '';
  const parts = String(text ?? '').split('$');
  parts.forEach((part, i) => {
    if (i % 2 === 0) {
      if (part) el.appendChild(document.createTextNode(part));
      return;
    }
    // 홀수 번째 조각이 수식
    const span = document.createElement('span');
    try {
      katex.render(part, span, { throwOnError: true, displayMode: false });
    } catch (e) {
      span.textContent = part;   // 변환 실패한 수식은 원문 그대로
      span.style.color = '#cc7070';
    }
    el.appendChild(span);
  });
}
function levelOf(score) { return Math.floor((score || 0) / XP_PER_LEVEL) + 1; }

/* ============================================================
   효과: 소리 / 컨페티 / XP 팝업
   ============================================================ */
let audioCtx = null;
function playTone(freqs, step = 0.11) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      const t0 = audioCtx.currentTime + i * step;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + step);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + step);
    });
  } catch (e) { /* 소리 실패는 무시 */ }
}
const soundCorrect = () => playTone([660, 880, 1180], 0.1);
const soundWrong   = () => playTone([220, 165], 0.14);

const cvs = $('confettiCanvas'), ctx = cvs.getContext('2d');
let parts = [], animating = false;
function sizeCanvas() { cvs.width = innerWidth; cvs.height = innerHeight; }
sizeCanvas(); addEventListener('resize', sizeCanvas);

function confetti() {
  const colors = ['#4ecdb0', '#5ec5e0', '#f7c948', '#ff8f8f', '#b8a7e0'];
  const cx = innerWidth / 2, cy = innerHeight * 0.4;
  for (let i = 0; i < 80; i++) {
    parts.push({
      x: cx + (Math.random() - 0.5) * 140,
      y: cy + (Math.random() - 0.5) * 40,
      vx: (Math.random() - 0.5) * 10,
      vy: Math.random() * -12 - 3,
      w: 5 + Math.random() * 7,
      c: colors[(Math.random() * colors.length) | 0],
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.32,
      life: 1
    });
  }
  if (!animating) { animating = true; requestAnimationFrame(tickConfetti); }
}
function tickConfetti() {
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  parts.forEach(p => {
    p.vy += 0.38; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= 0.009;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.c;
    ctx.fillRect(-p.w / 2, -p.w / 2, p.w, p.w * 0.62);
    ctx.restore();
  });
  parts = parts.filter(p => p.life > 0 && p.y < cvs.height + 60);
  if (parts.length) requestAnimationFrame(tickConfetti);
  else { animating = false; ctx.clearRect(0, 0, cvs.width, cvs.height); }
}

function showXpPop(text) {

function getProgress(card) {

function isDue(card) {
  const p = getProgress(card);
  if (!p.last_reviewed) return true;
  const days = STAGE_INTERVAL_DAYS[p.leitner_stage] ?? 0;
  return new Date(p.last_reviewed).getTime() + days * 86400000 <= Date.now();
}

function buildQueue() {

/* ============================================================
   자동 채점
   말한 내용에 정답의 핵심 낱말이 얼마나 들어있는지로 판정한다.
   음성 인식은 띄어쓰기·조사가 들쭉날쭉해서 공백을 지우고 비교한다.
   ============================================================ */
const PASS_RATIO = 0.6;   // 핵심 낱말의 60% 이상 → 정답

function normalize(s) {
  return String(s || '').replace(/\s+/g, '').toLowerCase();
}

function gradeBySpeech(card, transcript) {
  const keys = (card.keywords || '').split(',').map(k => k.trim()).filter(Boolean);
  if (!keys.length) return null;

  const said = normalize(transcript);
  const hit = keys.filter(k => said.includes(normalize(k)));
  const ratio = hit.length / keys.length;

  return {
    keys, hit,
    miss: keys.filter(k => !hit.includes(k)),
    ratio,
    pass: ratio >= PASS_RATIO
  };
}

function showVerdict(r) {
  if (!r) { verdictEl.classList.remove('on'); return; }

  const level = r.pass ? 'pass' : (r.ratio >= 0.3 ? 'near' : 'fail');
  const head = r.pass
    ? `잘했어요! 핵심 ${r.keys.length}개 중 ${r.hit.length}개를 말했어요`
    : (r.ratio >= 0.3
        ? `조금 더! 핵심 ${r.keys.length}개 중 ${r.hit.length}개만 나왔어요`
        : `아직이에요. 정답을 보고 다시 말해볼까요?`);

  verdictEl.className = 'verdict on ' + level;
  verdictEl.innerHTML =
    esc(head) +
    '<div class="kw">' +
    r.keys.map(k =>
      `<span class="${r.hit.includes(k) ? 'hit' : 'miss'}">${r.hit.includes(k) ? '✓' : '✗'} ${esc(k)}</span>`
    ).join('') +
    '</div>';
}

function nextCard() {
  pendingSpeechResult = null;
  cardSkeleton.classList.add('hidden');

  cardBody.classList.remove('hidden');

  setStage(1);

  current = queue.shift();
  const p = getProgress(current);

  tagStage.textContent = `단계 ${p.leitner_stage}/5`;

  const speakable = current.mode !== 'write';
  tagMode.textContent = speakable ? '🗣 말하기' : '✍️ 필기';
  tagMode.className = 'tag tag-mode ' + (speakable ? 'speak' : 'write');

  // 필기형은 소리 내어 답할 수 없으니 마이크를 감춘다
  micBtn.classList.toggle('hidden', !speakable || !recognition);

}

async function grade(correct, advance = true) {
  if (!current || !profile) return;
  const card = current;
  const nowIso = new Date().toISOString();
  const newStage = correct
    ? Math.min(getProgress(card).leitner_stage + 1, 5)
    : 1;

  // 낙관적 갱신 (화면 먼저 반응)
  progressMap[card.id] = { leitner_stage: newStage, last_reviewed: nowIso };
  logs.push({ card_id: card.id, correct, studied_at: nowIso });

  if (correct) {
    flashcard.classList.add('pop');
    setTimeout(() => flashcard.classList.remove('pop'), 400);
    soundCorrect(); confetti(); showXpPop(`+${XP_PER_CORRECT} XP`);
    profile.score += XP_PER_CORRECT;
    profile.correct_count += 1;
  } else {
    flashcard.classList.add('shake');
    setTimeout(() => flashcard.classList.remove('shake'), 400);
    soundWrong();
  }

  refreshHud();
  // 자동 채점일 때는 채점 결과를 읽을 시간을 주고, 학생이 직접 넘긴다
  if (advance) setTimeout(nextCard, correct ? 620 : 420);

  // 서버 저장
  const tasks = [
    sb.from('user_card_progress').upsert({
      user_id: profile.id, card_id: card.id,
      leitner_stage: newStage, last_reviewed: nowIso
    }, { onConflict: 'user_id,card_id' }),
    sb.from('study_log').insert({ user_id: profile.id, card_id: card.id, correct })
  ];
  if (correct) {
    tasks.push(sb.from('profiles')
      .update({ score: profile.score, correct_count: profile.correct_count })
      .eq('id', profile.id));
  }
  const results = await Promise.all(tasks);
  results.forEach(r => { if (r && r.error) console.error(r.error); });

  if (correct) renderRank();
  renderMe();
}

correctBtn.addEventListener('click', () => grade(true));

/* ============================================================
   HUD (스트릭 / 레벨 / 오늘 목표)
   ============================================================ */
function computeStreak() {
  const days = new Set(logs.map(l => dateKey(new Date(l.studied_at))));
  if (days.size === 0) return 0;

  const today = new Date();
  const todayK = dateKey(today);
  const yest = new Date(today); yest.setDate(yest.getDate() - 1);

  // 오늘도 어제도 기록이 없으면 스트릭 끊김
  let cursor = new Date(today);
  if (!days.has(todayK)) {
    if (!days.has(dateKey(yest))) return 0;
    cursor = yest;
  }
  let count = 0;
  while (days.has(dateKey(cursor))) {
    count++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return count;
}

function todayCount() {
  const k = dateKey(new Date());
  return logs.filter(l => dateKey(new Date(l.studied_at)) === k).length;
}

function refreshHud() {
  streakVal.textContent = computeStreak();
  levelVal.textContent = levelOf(profile?.score);
  const t = todayCount();
  goalText.textContent = `${Math.min(t, DAILY_GOAL)} / ${DAILY_GOAL}`;
  goalFill.style.width = Math.min(100, (t / DAILY_GOAL) * 100) + '%';
}

async function renderRank() {

    .select('*').order('score', { ascending: false }).limit(100);

  if (!data.length) { rankList.innerHTML = '<div class="skeleton">아직 기록이 없어요.</div>'; return; }

  renderMiniRank(data);

  rankList.innerHTML = data.slice(0, 30).map((s, i) => `
    <div class="rank-row ${profile && s.id === profile.id ? 'me' : ''}">
      <div class="rank-badge">${i < 3 ? MEDALS[i] : i + 1}</div>
      <div class="rank-name">
        ${esc(s.name)}
        <div class="rank-sub">Lv.${levelOf(s.score)} · 정답 ${s.correct_count || 0}개</div>
      </div>
      <div class="rank-score">${s.score || 0}</div>
    </div>
  `).join('');
}

/* ---------- 학습 화면 하단 미니 랭킹 ---------- */
function renderMiniRank(board) {
  if (!profile) return;

  const myIdx = board.findIndex(s => s.id === profile.id);
  const myRank = myIdx >= 0 ? myIdx + 1 : board.length + 1;
  const myScore = profile.score || 0;

  mrMedal.textContent = myRank <= 3 ? MEDALS[myRank - 1] : '🏅';
  mrRank.innerHTML = `전체 <em>${myRank}위</em> / ${board.length}명`;
  mrXp.textContent = myScore.toLocaleString() + ' XP';

  // 바로 위 사람까지 남은 XP
  const above = myIdx > 0 ? board[myIdx - 1] : null;
  if (above) {
    const gap = (above.score || 0) - myScore + 1;
    mrChase.className = 'chase';
    mrChase.textContent = `${above.name}님까지 ${Math.max(gap, 1)} XP 🔥`;
  } else if (myIdx === 0) {
    const below = board[1];
    mrChase.className = 'chase lead';
    mrChase.textContent = below
      ? `1위 수성 중 · ${below.name}님과 ${myScore - (below.score || 0)} XP 차이`
      : '1위 독주 중이에요';
  } else {
    mrChase.className = 'chase';
    mrChase.textContent = '한 문제만 맞혀도 순위에 올라가요';
  }

  // 내 주변 순위 (위 2명 + 나 + 아래 2명)
  const from = Math.max(0, myIdx - 2);
  const near = board.slice(from, from + 5);

  mrList.innerHTML = near.map((s, i) => `
    <div class="mr-row ${s.id === profile.id ? 'me' : ''}">
      <span class="n">${from + i < 3 ? MEDALS[from + i] : from + i + 1}</span>
      <span class="nm">${esc(s.name)}</span>
      <span class="sc">${(s.score || 0).toLocaleString()}</span>
    </div>
  `).join('') + `<button class="mr-more" id="mrMore">전체 랭킹 보기 →</button>`;

  $('mrMore').addEventListener('click', () => {
    document.querySelector('.tabbar button[data-tab="rank"]').click();
  });
}

/* ============================================================
   내 기록 (통계 + 달력)
   ============================================================ */
function renderMe() {
  mStreak.textContent = computeStreak() + '일';
  mXp.textContent = (profile?.score || 0).toLocaleString();

  const total = logs.length;
  const ok = logs.filter(l => l.correct).length;
  mAcc.textContent = total ? Math.round((ok / total) * 100) + '%' : '—';

  const master = Object.values(progressMap).filter(p => p.leitner_stage >= 5).length;
  mMaster.textContent = master;

  renderCalendar();
}

function renderCalendar() {
  const y = calCursor.getFullYear(), m = calCursor.getMonth();
  calTitle.textContent = `${y}년 ${m + 1}월`;

  // 날짜별 학습 횟수
  const counts = {};
  logs.forEach(l => {
    const k = dateKey(new Date(l.studied_at));
    counts[k] = (counts[k] || 0) + 1;
  });

  const first = new Date(y, m, 1);
  const lastDay = new Date(y, m + 1, 0).getDate();
  const lead = first.getDay();
  const todayK = dateKey(new Date());

  const dows = ['일','월','화','수','목','금','토'];
  let html = dows.map((d, i) =>
    `<div class="cal-dow ${i === 0 ? 'sun' : ''}">${d}</div>`).join('');

  for (let i = 0; i < lead; i++) html += `<div class="cal-cell empty"></div>`;

  for (let d = 1; d <= lastDay; d++) {
    const k = dateKey(new Date(y, m, d));
    const c = counts[k] || 0;
    let lv = '';
    if (c >= 20) lv = 'l4';
    else if (c >= 10) lv = 'l3';
    else if (c >= 5) lv = 'l2';
    else if (c >= 1) lv = 'l1';
    html += `<div class="cal-cell ${lv} ${k === todayK ? 'today' : ''}" title="${k} · ${c}장">${d}</div>`;
  }
  calGrid.innerHTML = html;
}

$('calPrev').addEventListener('click', () => {
  calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() - 1, 1);
  renderCalendar();
});
$('calNext').addEventListener('click', () => {
  calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() + 1, 1);
  renderCalendar();
});

/* ============================================================
   탭 전환
   ============================================================ */
document.querySelectorAll('.tabbar button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabbar button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    $('tab-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'rank') renderRank();
    if (btn.dataset.tab === 'me')   renderMe();
  });
});

/* ============================================================
   음성 인식
   ============================================================ */
let recognition = null;
let listening = false;
let transcript = '';

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  recognition = new SR();
  recognition.lang = 'ko-KR';
  recognition.continuous = true;      // 말이 잠깐 끊겨도 계속 듣는다
  recognition.interimResults = true;  // 말하는 중에도 화면에 보여준다

  recognition.onresult = e => {
    let fixed = '', tentative = '';
    for (let i = 0; i < e.results.length; i++) {
      const txt = e.results[i][0].transcript;
      if (e.results[i].isFinal) fixed += txt;
      else tentative += txt;
    }
    transcript = (fixed + tentative).trim();
    heardText.textContent = '🗣️ ' + (transcript || '…');
    heardText.classList.add('on');
  };

  recognition.onerror = ev => {
    if (ev.error === 'no-speech') return;   // 잠깐 조용한 건 오류가 아니다
    heardText.textContent = ev.error === 'not-allowed'
      ? '마이크 권한이 필요해요. 주소창의 자물쇠에서 허용해주세요.'
      : '잘 안 들렸어요. 다시 시도해볼까요?';
    heardText.classList.add('on');
    setMicIdle();
  };

  recognition.onend = () => { if (listening) setMicIdle(); };
}

function setMicIdle() {
  listening = false;
  micBtn.classList.remove('listening');
  micBtn.textContent = '🎤 말하기';
}

function stopListening() {
  transcript = '';
  if (!recognition || !listening) { setMicIdle(); return; }
  try { recognition.stop(); } catch (e) { /* 이미 멈춘 상태 */ }
  setMicIdle();
}

micBtn.addEventListener('click', () => {
  if (!recognition) return;

  if (listening) {          // 두 번째 누름 = 말하기 종료 후 채점
    try { recognition.stop(); } catch (e) { /* noop */ }
    setMicIdle();
    finishSpeaking();
    return;
  }

  transcript = '';
  listening = true;
  micBtn.classList.add('listening');
  micBtn.textContent = '⏹ 말하기 종료';
  heardText.textContent = '듣고 있어요…';
  heardText.classList.add('on');
  verdictEl.classList.remove('on');
  try {
    recognition.start();
  } catch (e) {
    setMicIdle();
  }
});

/* 말하기를 끝내면 앱이 채점한다. 학생이 직접 맞다/틀리다를 고르지 않는다. */
function finishSpeaking() {
  if (!current) return;

  const result = gradeBySpeech(current, transcript);
  if (!result) {              // 채점 기준이 없는 문제
    cardAnswer.classList.add('on');
    setStage(2);
    return;
  }

  showVerdict(result);
  cardAnswer.classList.add('on');
  setStage(3);
  pendingSpeechResult = result.pass;   // 다시 말하기 누르면 취소될 수 있어 아직 서버 저장 안 함
}

/* 음성인식이 잘못 들었을 때: 방금 채점은 취소하고 같은 카드를 다시 듣는다 */
retryBtn.addEventListener('click', () => {
  pendingSpeechResult = null;
  cardAnswer.classList.remove('on');
  verdictEl.classList.remove('on');
  heardText.classList.remove('on');
  heardText.textContent = '';
  setStage(1);
});

nextBtn.addEventListener('click', async () => {
  if (pendingSpeechResult !== null) {
    const pass = pendingSpeechResult;
    pendingSpeechResult = null;
    await grade(pass, false);
  }
  nextCard();
});

if (!SR) {
  micBtn.disabled = true;
  micBtn.textContent = '🎤 미지원';
  micBtn.title = '크롬 브라우저에서 음성 인식을 쓸 수 있어요';
}

/* ============================================================
   앱 시작
   ============================================================ */
async function startApp(fallbackName) {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;

  profile = await ensureProfile(user.id, fallbackName || nameInput.value.trim());
  if (!profile) return setMsg('프로필을 만들 수 없었어요.', 'err');

  authScreen.classList.add('hidden');
  app.classList.remove('hidden');
  userName.textContent = profile.name;

  const [cardsRes, progRes, logRes] = await Promise.all([
    sb.from('concept_cards').select('*'),
    sb.from('user_card_progress').select('*').eq('user_id', user.id),
    sb.from('study_log').select('card_id, correct, studied_at')
      .eq('user_id', user.id)
      .order('studied_at', { ascending: false })
      .limit(20000)
  ]);

  if (cardsRes.error) {
    cardSkeleton.textContent = '카드를 불러올 수 없어요: ' + cardsRes.error.message;
    return;
  }
  allCards = cardsRes.data || [];
  progressMap = {};
  (progRes.data || []).forEach(p => { progressMap[p.card_id] = p; });
  logs = logRes.data || [];

  renderUnits();
  buildQueue();
  nextCard();
  refreshHud();
  renderRank();
  renderMe();
}

(async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) await startApp();
})();
</script>
